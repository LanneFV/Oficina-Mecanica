<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordens de Serviço — Oficina Mecânica</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f4f4f4; color: #333; }
        header { background: #1a1a2e; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 1.2rem; }
        nav a { color: #fff; text-decoration: none; margin-left: 18px; font-size: .9rem; opacity: .75; }
        nav a:hover { opacity: 1; }
        nav a.ativa { opacity: 1; font-weight: 700; border-bottom: 2px solid #facc15; }
        main { max-width: 1100px; margin: 30px auto; padding: 0 16px; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.1); padding: 24px; margin-bottom: 24px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e5e5e5; }
        th { background: #f0f0f0; font-weight: 600; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.78rem; font-weight: 600; }
        .badge-aberta       { background: #fde68a; color: #92400e; }
        .badge-em-andamento { background: #bfdbfe; color: #1e40af; }
        .badge-concluida    { background: #d1fae5; color: #065f46; }
        .badge-cancelada    { background: #fee2e2; color: #991b1b; }
        button { cursor: pointer; border: none; border-radius: 5px; padding: 7px 14px; font-size: 0.85rem; font-weight: 600; }
        button:hover { opacity: 0.85; }
        .btn-primary { background: #1a1a2e; color: #fff; }
        .btn-edit    { background: #3b82f6; color: #fff; }
        .btn-delete  { background: #ef4444; color: #fff; }
        .btn-logout  { background: #6b7280; color: #fff; }
        .btn-cancel  { background: #e5e7eb; color: #333; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; justify-content: center; align-items: center; }
        .modal-overlay.open { display: flex; }
        .modal { background: #fff; border-radius: 10px; padding: 28px; width: 100%; max-width: 480px; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-height: 90vh; overflow-y: auto; }
        .modal h3 { margin-bottom: 18px; font-size: 1rem; color: #1a1a2e; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
        input, select { width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 5px; font-size: 0.9rem; margin-bottom: 14px; }
        .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
        .msg { padding: 10px 14px; border-radius: 6px; font-size: 0.88rem; margin-bottom: 16px; display: none; }
        .msg.ok  { background: #d1fae5; color: #065f46; }
        .msg.err { background: #fee2e2; color: #991b1b; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .toolbar h2 { font-size: 1.1rem; color: #1a1a2e; }
    </style>
</head>
<body>

<header>
    <h1>Oficina Mecânica — Ordens de Serviço</h1>
    <div style="display:flex;align-items:center;gap:16px;">
        <nav>
            <a href="../app/views/dashboard.php">Painel</a>
            <a href="ordens.html" class="ativa">Ordens</a>
            <a href="../app/views/pecas.php">Peças</a>
            <a href="clientes.html">Clientes</a>
            <a href="veiculos.html">Veículos</a>
            <a href="mecanicos.html">Mecânicos</a>
            <a href="servicos.html">Serviços</a>
        </nav>
        <span id="info-usuario" style="font-size:.9rem;opacity:.85;"></span>
        <button class="btn-logout" onclick="fazerLogout()">Sair</button>
    </div>
</header>

<main>
    <div class="card">
        <div class="toolbar">
            <h2>Ordens de Serviço</h2>
            <button class="btn-primary" id="btn-nova-os" style="display:none" onclick="abrirModalNovo()">+ Nova OS</button>
        </div>
        <div id="msg-lista" class="msg"></div>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Status</th>
                    <th>Placa</th>
                    <th>Cliente</th>
                    <th>Mecânico</th>
                    <th>Abertura</th>
                    <th>Entrega Prevista</th>
                    <th>Garantia</th>
                    <th id="col-acoes" style="display:none">Ações</th>
                </tr>
            </thead>
            <tbody id="corpo-tabela">
                <tr><td colspan="9" style="text-align:center;color:#888;padding:20px">Carregando...</td></tr>
            </tbody>
        </table>
    </div>
</main>

<div id="modal-os" class="modal-overlay">
    <div class="modal">
        <h3 id="modal-titulo">Nova Ordem de Serviço</h3>
        <input type="hidden" id="modal-id">
        <div id="msg-modal" class="msg"></div>
        <label>Status</label>
        <select id="m-status">
            <option value="">Selecione...</option>
            <option value="aberta">Aberta</option>
            <option value="em andamento">Em Andamento</option>
            <option value="concluida">Concluída</option>
            <option value="cancelada">Cancelada</option>
        </select>
        <label>Veículo</label>
        <select id="m-veiculo"><option value="">Selecione...</option></select>
        <label>Mecânico</label>
        <select id="m-mecanico"><option value="">Selecione...</option></select>
        <label>Data de Entrega Prevista</label>
        <input type="date" id="m-entrega">
        <label>Garantia (meses)</label>
        <input type="number" id="m-garantia" min="0" placeholder="Ex: 6">
        <div class="modal-footer">
            <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
            <button class="btn-primary" id="btn-salvar" onclick="salvarOS()">Salvar</button>
        </div>
    </div>
</div>

<script src="ordens.js"></script>
</body>
</html>
