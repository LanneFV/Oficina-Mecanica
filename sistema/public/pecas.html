<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peças — Oficina Mecânica</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f4f4f4; color: #333; }
        header { background: #1a1a2e; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 1.2rem; }
        nav a { color: #fff; text-decoration: none; margin-left: 18px; font-size: .9rem; opacity: .75; }
        nav a:hover { opacity: 1; }
        nav a.ativa { opacity: 1; font-weight: 700; border-bottom: 2px solid #facc15; }
        main { max-width: 1000px; margin: 30px auto; padding: 0 16px; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.1); padding: 24px; margin-bottom: 24px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e5e5e5; }
        th { background: #f0f0f0; font-weight: 600; }
        .estoque-baixo { color: #dc2626; font-weight: 700; }
        .estoque-ok    { color: #059669; font-weight: 600; }
        button { cursor: pointer; border: none; border-radius: 5px; padding: 7px 14px; font-size: 0.85rem; font-weight: 600; }
        button:hover { opacity: 0.85; }
        .btn-primary { background: #1a1a2e; color: #fff; }
        .btn-edit    { background: #3b82f6; color: #fff; }
        .btn-delete  { background: #ef4444; color: #fff; }
        .btn-logout  { background: #6b7280; color: #fff; }
        .btn-cancel  { background: #e5e7eb; color: #333; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; justify-content: center; align-items: center; }
        .modal-overlay.open { display: flex; }
        .modal { background: #fff; border-radius: 10px; padding: 28px; width: 100%; max-width: 440px; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
        .modal h3 { margin-bottom: 18px; font-size: 1rem; color: #1a1a2e; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
        input, textarea { width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 5px; font-size: 0.9rem; margin-bottom: 14px; font-family: inherit; }
        textarea { resize: vertical; min-height: 80px; }
        .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
        .msg { padding: 10px 14px; border-radius: 6px; font-size: 0.88rem; margin-bottom: 16px; display: none; }
        .msg.ok  { background: #d1fae5; color: #065f46; }
        .msg.err { background: #fee2e2; color: #991b1b; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .toolbar h2 { font-size: 1.1rem; color: #1a1a2e; }
    </style>
</head>
<body>

<header>
    <h1>Oficina Mecânica — Peças</h1>
    <div style="display:flex;align-items:center;gap:16px;">
      <nav>
            <a href="../app/views/dashboard.php">Painel</a>
            <a href="ordens.html">Ordens</a>
            <a href="pecas.html" class="ativa">Peças</a>
            <a href="clientes.html">Clientes</a>
            <a href="veiculos.html">Veículos</a>
            <a href="mecanicos.html">Mecânicos</a>
            <a href="servicos.html">Serviços</a>
        </nav>
        <span id="info-usuario" style="font-size:.9rem;opacity:.85;"></span>
        <button class="btn-logout" onclick="fazerLogout()">Sair</button>
    </div>
</header>

<main>
    <div class="card">
        <div class="toolbar">
            <h2>Estoque de Peças</h2>
            <button class="btn-primary" id="btn-nova-peca" style="display:none" onclick="abrirModalNovo()">+ Nova Peça</button>
        </div>
        <div id="msg-lista" class="msg"></div>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th>Preço Unit.</th>
                    <th>Estoque</th>
                    <th id="col-acoes" style="display:none">Ações</th>
                </tr>
            </thead>
            <tbody id="corpo-tabela">
                <tr><td colspan="6" style="text-align:center;color:#888;padding:20px">Carregando...</td></tr>
            </tbody>
        </table>
    </div>
</main>

<div id="modal-peca" class="modal-overlay">
    <div class="modal">
        <h3 id="modal-titulo">Nova Peça</h3>
        <input type="hidden" id="modal-id">
        <div id="msg-modal" class="msg"></div>
        <label>Nome da Peça</label>
        <input type="text" id="m-nome" placeholder="Ex: Filtro de óleo">
        <label>Descrição</label>
        <textarea id="m-descricao" placeholder="Descrição detalhada..."></textarea>
        <label>Preço Unitário (R$)</label>
        <input type="number" id="m-preco" min="0" step="0.01" placeholder="0.00">
        <label>Nível de Estoque</label>
        <input type="number" id="m-estoque" min="0" placeholder="Quantidade">
        <div class="modal-footer">
            <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
            <button class="btn-primary" id="btn-salvar" onclick="salvarPeca()">Salvar</button>
        </div>
    </div>
</div>

<script src="pecas.js"></script>
</body>
</html>
