<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Veículos — Oficina</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f4f4f4; color: #333; }
        header { background: #1a1a2e; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 1.2rem; }
        nav a { color: #fff; text-decoration: none; margin-left: 18px; font-size: .9rem; opacity: .75; }
        nav a:hover { opacity: 1; }
        nav a.ativa { opacity: 1; font-weight: 700; border-bottom: 2px solid #facc15; }
        main { max-width: 900px; margin: 30px auto; padding: 0 16px; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.1); padding: 24px; margin-bottom: 24px; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .toolbar h2 { font-size: 1.1rem; color: #1a1a2e; }
        input, select { padding: 8px; margin: 5px; width: 200px; border: 1px solid #d1d5db; border-radius: 5px; }
        button { padding: 8px 16px; margin: 5px; cursor: pointer; border: none; border-radius: 5px; font-weight: 600; }
        .btn-primary { background: #1a1a2e; color: #fff; }
        .btn-edit    { background: #3b82f6; color: #fff; }
        .btn-delete  { background: #ef4444; color: #fff; }
        .btn-cancel  { background: #e5e7eb; color: #333; }
        .btn-logout  { background: #6b7280; color: #fff; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.88rem; }
        th, td { padding: 10px 12px; border-bottom: 1px solid #e5e5e5; text-align: left; }
        th { background: #f0f0f0; font-weight: 600; }
        .msg { padding: 10px 14px; border-radius: 6px; font-size: 0.88rem; margin-bottom: 16px; display: none; }
        .msg.ok  { background: #d1fae5; color: #065f46; }
        .msg.err { background: #fee2e2; color: #991b1b; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; justify-content: center; align-items: center; }
        .modal-overlay.open { display: flex; }
        .modal { background: #fff; border-radius: 10px; padding: 28px; width: 100%; max-width: 420px; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
        .modal h3 { margin-bottom: 18px; font-size: 1rem; color: #1a1a2e; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
        .modal input, .modal select { width: 100%; margin-bottom: 14px; }
        .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
    </style>
</head>
<body>
<header>
    <h1>Oficina Mecânica — Veículos</h1>
    <div style="display:flex;align-items:center;gap:16px;">
        <nav>
            <a href="../app/views/dashboard.php">Painel</a>
            <a href="../app/views/ordens.php">Ordens</a>
            <a href="../app/views/pecas.php">Peças</a>
            <a href="clientes.html">Clientes</a>
            <a href="veiculos.html" class="ativa">Veículos</a>
            <a href="mecanicos.html">Mecânicos</a>
            <a href="servicos.html">Serviços</a>
        </nav>
        <button class="btn-logout" onclick="fazerLogout()">Sair</button>
    </div>
</header>
<main>
    <div class="card">
        <div class="toolbar">
            <h2>Gerenciamento de Veículos</h2>
            <button class="btn-primary" onclick="abrirModal()">+ Novo Veículo</button>
        </div>
        <div id="msg-lista" class="msg"></div>
        <table>
            <thead>
                <tr><th>ID</th><th>Placa</th><th>Ano</th><th>Cliente</th><th>Modelo</th><th>Ações</th></tr>
            </thead>
            <tbody id="tabela"></tbody>
        </table>
    </div>
</main>
<div id="modal-veiculo" class="modal-overlay">
    <div class="modal">
        <h3 id="modal-titulo">Novo Veículo</h3>
        <input type="hidden" id="modal-id">
        <div id="msg-modal" class="msg"></div>
        <label>Placa</label>
        <input type="text" id="m-placa" placeholder="Placa">
        <label>Ano</label>
        <input type="number" id="m-ano" placeholder="Ano">
        <label>Cliente</label>
        <select id="m-cliente"><option value="">Selecione o Cliente</option></select>
        <label>Modelo</label>
        <select id="m-modelo"><option value="">Selecione o Modelo</option></select>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
            <button class="btn-primary" onclick="salvar()">Salvar</button>
        </div>
    </div>
</div>
<script src="veiculos.js"></script>
<script>
function fazerLogout() {
    fetch('../app/controllers/logoutcontroller.php', { method: 'POST' })
        .then(r => r.json())
        .then(() => { window.location.href = 'index.html'; })
        .catch(() => { window.location.href = 'index.html'; });
}
function abrirModal() {
    document.getElementById('modal-titulo').textContent = 'Novo Veículo';
    document.getElementById('modal-id').value = '';
    document.getElementById('m-placa').value = '';
    document.getElementById('m-ano').value = '';
    document.getElementById('m-cliente').value = '';
    document.getElementById('m-modelo').value = '';
    document.getElementById('msg-modal').style.display = 'none';
    document.getElementById('modal-veiculo').classList.add('open');
}
function fecharModal() {
    document.getElementById('modal-veiculo').classList.remove('open');
}
</script>
</body>
</html>
